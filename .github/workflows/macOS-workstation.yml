name: macOS Remote Workstation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workstation:
    runs-on: macos-15
    timeout-minutes: 355
    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: mac-${{ github.run_id }}
      - name: Configure Screen Sharing
        shell: bash
        run: |
          set -euo pipefail
          printf 'Console owner: '; stat -f '%Su' /dev/console
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -allowAccessFor -allUsers -privs -all
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true
          echo 'Screens host: mac-${{ github.run_id }}:5900'
      - name: Start authenticated interactive tmate session
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          brew install tmate
          curl -fsSL "https://github.com/${ACTOR}.keys" -o /tmp/workstation-authorized-keys
          [[ -s /tmp/workstation-authorized-keys ]] || { echo 'No GitHub SSH key for triggering actor'; exit 1; }
          nohup caffeinate -dimsu -t 21000 >/tmp/caffeinate.log 2>&1 </dev/null &
          tmate -S /tmp/workstation.sock -a /tmp/workstation-authorized-keys new-session -d
          tmate -S /tmp/workstation.sock wait tmate-ready
          echo 'SSH with your GitHub SSH key:'
          tmate -S /tmp/workstation.sock display -p '#{tmate_ssh}'
          echo 'In tmate, create an admin user; type its password at the prompt:'
          echo 'sudo sysadminctl -addUser screensadmin -admin -password -'
          echo 'Then connect Screens as screensadmin on port 5900. Cancel the run when done.'
          while tmate -S /tmp/workstation.sock has-session 2>/dev/null; do
            [[ ! -f /tmp/stop ]] || break
            sleep 10
          done
