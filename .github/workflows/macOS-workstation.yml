#YAML

name: macOS Remote Workstation
on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Session timeout in minutes (max 350)'
        required: true
        default: '180'
        type: string
      runner_arch:
        description: 'macOS Runner Architecture'
        required: true
        default: 'macos-latest'
        type: choice
        options:
          - macos-latest # Apple Silicon (M1/M2)
          - macos-15     # Apple Silicon (macOS Sequoia)
          - macos-13     # Intel x86_64

jobs:
  workstation:
    runs-on: ${{ github.event.inputs.runner_arch }}
    timeout-minutes: 355

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: mac-${{ github.event.repository.name }}

      - name: Enable SSH & macOS Screen Sharing (VNC)
        run: |
          # 1. Create a dedicated admin user for VNC/SSH
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "${{ secrets.RUNNER_PASSWORD }}" -admin

          # 2. Enable SSH (Remote Login)
          sudo systemsetup -setremotelogin on

          # 3. Enable macOS Screen Sharing & write XOR-hashed VNC password directly
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -allowAccessFor -allUsers -privs -all -restart -agent

          echo "${{ secrets.RUNNER_PASSWORD }}" | perl -we '
            BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA" };
            $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_;
            foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null

          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.txt
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

          echo "=========================================="
          echo "Tailscale Hostname: mac-${{ github.event.repository.name }}"
          echo "VNC Address: vnc://mac-${{ github.event.repository.name }}:5900"
          echo "SSH Command: ssh vncuser@mac-${{ github.event.repository.name }}"
          echo "=========================================="

      - name: Diagnose macOS Desktop
        run: |
          echo "=== Console User ==="
          stat -f '%Su' /dev/console

          echo "=== GUI Processes ==="
          pgrep -fl \
            'WindowServer|loginwindow|Finder|screensharingd|ARDAgent' || true

          echo "=== VNC Service ==="
          sudo launchctl print \
            system/com.apple.screensharing 2>&1 | head -40

          echo "=== VNC User GUI Session ==="
          UID_VNC=$(id -u vncuser)
          if sudo launchctl print \
            "gui/$UID_VNC" >/dev/null 2>&1; then
            echo "GUI domain exists"
          else
            echo "No GUI domain for vncuser"
          fi

      - name: Keep Workstation Alive
        run: |
          DURATION=$(( ${{ github.event.inputs.duration_minutes }} * 60 ))
          END_TIME=$(( $(date +%s) + DURATION ))
          
          echo "Session active for ${{ github.event.inputs.duration_minutes }} minutes."
          echo "To end early, run 'touch /tmp/stop' in SSH or cancel the workflow in GitHub."
          
          while [ $(date +%s) -lt $END_TIME ] && [ ! -f /tmp/stop ]; do
            sleep 10
          done