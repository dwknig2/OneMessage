name: macOS Remote Workstation
on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Session timeout (minutes, max 350)'
        required: true
        default: '180'
        type: string
      runner_arch:
        description: 'macOS Runner Architecture'
        required: true
        default: 'macos-latest'
        type: choice
        options:
          - macos-latest
          - macos-15
          - macos-13

jobs:
  workstation:
    runs-on: ${{ github.event.inputs.runner_arch }}
    timeout-minutes: 355

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: mac-${{ github.run_id }}

      - name: Enable SSH & Screen Sharing (VNC)
        run: |
          # 1. Set a password for the default 'runner' user so Screens 5 & SSH can log in
          sudo sysadminctl -resetPassword -user runner -password "${{ secrets.RUNNER_PASSWORD }}"

          # 2. Enable SSH
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist

          # 3. Enable Screen Sharing (VNC) and allow all users
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -allowAccessFor -allUsers -privs -all

          # 4. Keep the virtual display awake so Screens 5 doesn't see a black screen
          caffeinate -u -t 2 &
          
          echo "=========================================="
          echo "Tailscale Hostname: mac-${{ github.run_id }}"
          echo "VNC Address: mac-${{ github.run_id }}:5900"
          echo "SSH Command: ssh runner@mac-${{ github.run_id }}"
          echo "=========================================="

      - name: Keep Workstation Alive
        run: |
          DURATION=$(( ${{ github.event.inputs.duration_minutes }} * 60 ))
          END_TIME=$(( $(date +%s) + DURATION ))
          
          echo "Session active for ${{ github.event.inputs.duration_minutes }} minutes."
          echo "To end early, run 'touch /tmp/stop' in SSH or cancel the workflow in GitHub."
          
          while [ $(date +%s) -lt $END_TIME ] && [ ! -f /tmp/stop ]; do
            sleep 10
          done