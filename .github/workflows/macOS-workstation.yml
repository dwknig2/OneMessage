name: macOS Remote Workstation
on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Session duration (1–350 minutes)'
        required: true
        default: '180'
        type: string
permissions:
  contents: read
jobs:
  workstation:
    runs-on: macos-15
    timeout-minutes: 355
    steps:
      - name: Validate duration
        id: session
        env:
          MINUTES: ${{ inputs.duration_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && (( MINUTES >= 1 && MINUTES <= 350 )) || { echo 'Duration must be 1–350 minutes'; exit 1; }
          echo "seconds=$(( MINUTES * 60 ))" >> "$GITHUB_OUTPUT"
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: mac-${{ github.run_id }}
      - name: Enable Tailscale SSH and Screen Sharing
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale up --ssh
          printf 'Console owner: '; stat -f '%Su' /dev/console
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -allowAccessFor -allUsers -privs -all
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN
          echo 'Screens: mac-${{ github.run_id }}:5900 (visible in Screens tailnet integration)'
          echo 'Terminal: ssh runner@mac-${{ github.run_id }} (requires tailnet SSH policy)'
          echo 'From SSH, create admin interactively: sudo sysadminctl -addUser screensadmin -admin -password -'
      - name: Keep workstation alive
        env:
          SECONDS_TO_RUN: ${{ steps.session.outputs.seconds }}
        shell: bash
        run: |
          set -euo pipefail
          caffeinate -dimsu -t "$SECONDS_TO_RUN" &
          CAFFEINATE_PID=$!
          trap 'kill "$CAFFEINATE_PID" 2>/dev/null || true' EXIT
          end=$(( $(date +%s) + SECONDS_TO_RUN ))
          while (( $(date +%s) < end )); do
            [[ ! -f /tmp/stop ]] || break
            sleep 10
          done
