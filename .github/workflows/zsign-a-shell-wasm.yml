name: zsign for a-Shell

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/zsign-a-shell-wasm.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/zsign-a-shell-wasm.yml']

permissions:
  contents: read

concurrency:
  group: zsign-ashell-${{ github.ref }}
  cancel-in-progress: false

env:
  SDK_REV: 3d2154daab00d4479d855a661355566b2e393702
  ZSIGN_REV: 9299685bab7ef99827e06e5dfda93af747386590
  OPENSSL_REV: 45e844fa2a14ec92d146bd8f5778ac130b6625fb # openssl-3.5.9
  WASI_SDK_PATH: /tmp/wasi-sdk-install
  SSL_PREFIX: /tmp/wasi-openssl
  TARGET: wasm32-wasip1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Compute reusable cache keys
        id: keys
        run: |
          # Bump the relevant recipe version after changing that stage's flags.
          host="holzschu-ubuntu24-${RUNNER_ARCH}-${SDK_REV}-host1"
          root="${host}-${TARGET}-nolto-noexceptions-root2"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "ssl=${root}-openssl-${OPENSSL_REV}-ssl1" >> "$GITHUB_OUTPUT"

      - name: Restore host compiler
        id: host
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.host }}
          path: /tmp/wasi-sdk-install

      - name: Restore sysroot overlay
        id: root
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.root }}
          path: /tmp/wasi-overlay

      - name: Check out SDK and pinned submodules only on a miss
        if: steps.host.outputs.cache-hit != 'true' || steps.root.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: holzschu/wasi-sdk
          ref: ${{ env.SDK_REV }}
          path: sdk-src
          submodules: recursive
          persist-credentials: false

      - name: Resolve pinned SDK version from release tags
        if: steps.host.outputs.cache-hit != 'true' || steps.root.outputs.cache-hit != 'true'
        working-directory: sdk-src
        run: |
          fetch_args=(--tags --no-recurse-submodules)
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            fetch_args+=(--unshallow)
          fi
          git fetch "${fetch_args[@]}" origin
          describe=(git describe --long --candidates=999 --match='wasi-sdk-*' --dirty=+m --abbrev=12)
          if ! "${describe[@]}"; then
            # Forks may omit upstream release tags. Keep the pinned checkout in place.
            git fetch --no-tags --no-recurse-submodules https://github.com/WebAssembly/wasi-sdk.git \
              'refs/tags/wasi-sdk-*:refs/tags/wasi-sdk-*'
            "${describe[@]}"
          fi

      - name: Build host compiler
        if: steps.host.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja -S sdk-src -B "$RUNNER_TEMP/build-host" \
            -DWASI_SDK_BUILD_TOOLCHAIN=ON -DCMAKE_INSTALL_PREFIX="$WASI_SDK_PATH"
          cmake --build "$RUNNER_TEMP/build-host" --target install
          "$WASI_SDK_PATH/bin/clang" --version
          rm -rf "$RUNNER_TEMP/build-host"

      - name: Save host compiler immediately
        if: steps.host.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.host }}
          path: /tmp/wasi-sdk-install

      - name: Build Preview 1 sysroot with the installed Clang
        if: steps.root.outputs.cache-hit != 'true'
        run: |
          # Use the staged WASI public headers and Clang's stddef.h, as upstream does.
          git -C sdk-src/src/wasi-libc apply - <<'PATCH'
          diff --git a/libc-top-half/CMakeLists.txt b/libc-top-half/CMakeLists.txt
          --- a/libc-top-half/CMakeLists.txt
          +++ b/libc-top-half/CMakeLists.txt
          @@ -21,7 +21,6 @@
           # libraries below.
           add_library(musl-top-half-interface INTERFACE)
           target_include_directories(musl-top-half-interface INTERFACE
          -  musl/include
             musl/src/include
             musl/src/internal
             musl/arch/wasm32
          PATCH
          cmake -G Ninja -S sdk-src -B "$RUNNER_TEMP/build-root" \
            -DCMAKE_TOOLCHAIN_FILE="$WASI_SDK_PATH/share/cmake/wasi-sdk-p1.cmake" \
            -DCMAKE_C_COMPILER_WORKS=ON -DCMAKE_CXX_COMPILER_WORKS=ON \
            -DCMAKE_INSTALL_PREFIX="$WASI_SDK_PATH" -DWASI_SDK_BUILD_TOOLCHAIN=OFF \
            -DWASI_SDK_TARGETS="$TARGET" -DWASI_SDK_LTO=OFF -DWASI_SDK_EXCEPTIONS=OFF \
            -DWASI_SDK_INSTALL_TO_CLANG_RESOURCE_DIR=ON
          cmake --build "$RUNNER_TEMP/build-root"
          DESTDIR=/tmp/wasi-overlay cmake --install "$RUNNER_TEMP/build-root"
          rm -rf "$RUNNER_TEMP/build-root"

      - name: Assemble SDK and link a C++ probe
        run: |
          cp -a "/tmp/wasi-overlay${WASI_SDK_PATH}/." "$WASI_SDK_PATH/"
          printf '#include <string>\nint main(int n,char** v){return std::string(v[0]).empty();}\n' |
            "$WASI_SDK_PATH/bin/clang++" --target="$TARGET" -fno-exceptions \
              -x c++ - -o "$RUNNER_TEMP/cxx-probe.wasm"

      - name: Save validated sysroot overlay
        if: steps.root.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.root }}
          path: /tmp/wasi-overlay

      - name: Restore static OpenSSL
        id: ssl
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.keys.outputs.ssl }}
          path: /tmp/wasi-openssl

      - name: Check out OpenSSL on a miss
        if: steps.ssl.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: openssl/openssl
          ref: ${{ env.OPENSSL_REV }}
          path: ssl-src
          persist-credentials: false

      - name: Build OpenSSL with WASI entropy and built-in providers
        if: steps.ssl.outputs.cache-hit != 'true'
        working-directory: ssl-src
        run: |
          export CC="$WASI_SDK_PATH/bin/clang" AR="$WASI_SDK_PATH/bin/llvm-ar"
          export RANLIB="$WASI_SDK_PATH/bin/llvm-ranlib"
          ./Configure gcc --prefix="$SSL_PREFIX" --libdir=lib \
            --with-rand-seed=getrandom no-asm no-shared no-module no-threads no-tests \
            no-ui-console no-sock no-dgram no-dso no-engine no-afalgeng no-async \
            "--target=$TARGET" -O2 -DNO_SYSLOG -DNO_CHMOD -D_WASI_EMULATED_SIGNAL \
            -D_WASI_EMULATED_PROCESS_CLOCKS -D_WASI_EMULATED_GETPID -D_WASI_EMULATED_MMAN
          make -j"$(nproc)" build_libs
          make install_dev

      - name: Confirm target OpenSSL links
        run: |
          printf '#include <openssl/rand.h>\nint main(void){unsigned char b;return RAND_bytes(&b,1)!=1;}\n' |
            "$WASI_SDK_PATH/bin/clang" --target="$TARGET" -I"$SSL_PREFIX/include" \
              -x c - -x none "$SSL_PREFIX/lib/libcrypto.a" -lwasi-emulated-signal \
              -lwasi-emulated-process-clocks -lwasi-emulated-getpid -lwasi-emulated-mman \
              -o "$RUNNER_TEMP/rand-probe.wasm"

      - name: Save OpenSSL before compiling zsign
        if: steps.ssl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.keys.outputs.ssl }}
          path: /tmp/wasi-openssl

      - name: Check out zsign
        uses: actions/checkout@v4
        with:
          repository: zhlynn/zsign
          ref: ${{ env.ZSIGN_REV }}
          path: zsign
          persist-credentials: false

      - name: Adapt pinned zsign sources for offline signing
        working-directory: zsign
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(file, old, new):
              path = Path(file)
              text = path.read_text()
              if text.count(old) != 1:
                  raise ValueError(f"Unexpected source in {file}: {old[:60]}")
              path.write_text(text.replace(old, new))

          def replace_section(file, start, end, replacement):
              text = Path(file).read_text()
              begin = text.index(start)
              finish = text.index(end, begin)
              edit(file, text[begin:finish], replacement)

          edit("src/zsign.cpp", "#include <sys/wait.h>", "")
          replace_section("src/zsign.cpp", "static bool InstallSignedIpa", "int usage()", '''static bool InstallSignedIpa(const string&)
          {
              ZLog::Error("Installation requires a separate device installer.\\n");
              return false;
          }

          ''')
          edit("src/signing.cpp", "#ifndef _WIN32\n\tif (ZFile::IsFileExists", "#if 0 // csreq is an external macOS program\n\tif (ZFile::IsFileExists")
          replace_section("src/certcheck.cpp", "#ifdef _WIN32", "// --- helpers", "")
          replace_section("src/certcheck.cpp", "static bool ExtractOCSPUrl", "// --- display", '''static OCSPResult PerformOCSP(X509*, X509*)
          {
              return {"Unknown", "", "Online OCSP is unavailable in the offline WASI build"};
          }

          ''')
          edit("src/common/common.h", "#include <sys/mman.h>", "")
          # Keep read-only mappings in memory. Retain writable file handles for writeback.
          replace_section("src/common/fs.cpp", "void* ZFile::MapFile", "bool ZFile::WriteFile(", '''namespace {
          struct Mapping {
              FILE* output;
              off_t offset;
              size_t length;
          };
          map<void*, Mapping> mappings;
          }

          void* ZFile::MapFile(const char* path, size_t offset, size_t size, size_t* psize, bool ro)
          {
              FILE* fp = fopen(path, ro ? "rb" : "r+b");
              if (!fp) return nullptr;
              struct stat st{};
              if (fstat(fileno(fp), &st) || st.st_size < 0 ||
                  uint64_t(offset) > uint64_t(st.st_size)) {
                  fclose(fp);
                  return nullptr;
              }
              uint64_t available = uint64_t(st.st_size) - offset;
              uint64_t wanted = size ? size : available;
              if (!wanted || wanted > available || wanted > SIZE_MAX ||
                  fseeko(fp, offset, SEEK_SET)) {
                  fclose(fp);
                  return nullptr;
              }
              size = static_cast<size_t>(wanted);
              void* data = malloc(size);
              if (!data || fread(data, 1, size, fp) != size) {
                  free(data);
                  fclose(fp);
                  return nullptr;
              }
              if (ro) fclose(fp);
              mappings.emplace(data, Mapping{ro ? nullptr : fp, off_t(offset), size});
              if (psize) *psize = size;
              return data;
          }

          bool ZFile::UnmapFile(void* data, size_t size)
          {
              auto it = mappings.find(data);
              if (it == mappings.end() || it->second.length != size) return false;
              const Mapping m = it->second;
              bool ok = true;
              if (m.output) {
                  ok = fseeko(m.output, m.offset, SEEK_SET) == 0 &&
                       fwrite(data, 1, size, m.output) == size;
                  if (fclose(m.output) != 0) ok = false;
              }
              mappings.erase(it);
              free(data);
              return ok;
          }

          ''')
          # Upstream inspection paths sometimes destroy a Mach-O without explicitly closing it.
          # Discard abandoned edits and release the file; only a successful explicit close commits.
          edit("src/common/fs.h", "static bool\t\tUnmapFile", "static void DiscardMapping(void* data);\n\tstatic bool\t\tUnmapFile")
          edit("src/common/fs.cpp", "bool ZFile::UnmapFile", '''void ZFile::DiscardMapping(void* data)
          {
              auto it = mappings.find(data);
              if (it == mappings.end()) return;
              if (it->second.output) fclose(it->second.output);
              mappings.erase(it);
              free(data);
          }

          bool ZFile::UnmapFile''')
          edit("src/macho.cpp", "m_pBase = NULL;\n\tm_sSize = 0;\n\tm_arrArchOes.clear();", "ZFile::DiscardMapping(m_pBase);\n\tm_pBase = NULL;\n\tm_sSize = 0;\n\tm_arrArchOes.clear();")
          edit("src/macho.cpp", "if (!ZFile::UnmapFile((void*)m_pBase, m_sSize))", "bool ok = ZFile::UnmapFile(m_pBase, m_sSize);\n\tm_pBase = NULL;\n\tif (!ok)")
          edit("src/macho.cpp", "FreeArchOes();\n\treturn CloseFile();", "bool ok = CloseFile();\n\tFreeArchOes();\n\treturn ok;")
          PY

      - name: Cross-compile with the upstream makefile and vendored ZIP sources
        run: |
          flags="--target=$TARGET -DMINIZIP_FOPEN_NO_64 -D_WASI_EMULATED_GETPID"
          libs="$SSL_PREFIX/lib/libssl.a $SSL_PREFIX/lib/libcrypto.a"
          libs+=" -lwasi-emulated-signal -lwasi-emulated-process-clocks"
          libs+=" -lwasi-emulated-getpid -lwasi-emulated-mman"
          make -j"$(nproc)" -C zsign/build/linux \
            CC="$WASI_SDK_PATH/bin/clang $flags" \
            CXX="$WASI_SDK_PATH/bin/clang++ $flags -fno-exceptions" \
            OPENSSL_INCLUDE="-I$SSL_PREFIX/include" OPENSSL_LIB="$libs" \
            VERSION="${ZSIGN_REV:0:12}"
          mkdir -p dist
          cp zsign/bin/zsign dist/zsign.wasm

      - name: Validate module and exercise signing on a copied fixture
        run: |
          export SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/zsign-smoke.XXXXXX")"
          mkdir "$SMOKE_ROOT/tmp"
          node --input-type=commonjs <<'JS'
          const fs = require('node:fs');
          const { WASI } = require('node:wasi');
          const binary = 'dist/zsign.wasm';
          const load = path => new WebAssembly.Module(fs.readFileSync(path));
          const signer = load(binary);
          const rand = load(process.env.RUNNER_TEMP + '/rand-probe.wasm');
          const imports = WebAssembly.Module.imports(signer);
          fs.writeFileSync('dist/imports.json', JSON.stringify(imports, null, 2));
          if (!WebAssembly.Module.exports(signer).some(x => x.name === '_start'))
            throw Error('Missing WASI command entry point');
          function run(module, args) {
            const wasi = new WASI({version:'preview1', args, preopens:{'/':process.env.SMOKE_ROOT}, returnOnExit:true});
            // The pinned a-Shell libc passes AT_FDCWD (-2) and the original path.
            // Node needs its sole preopened directory (fd 3) and a path relative to it.
            const host = {...wasi.wasiImport};
            // The fork enumerates preopens on first close, after opening a file.
            // The single configured preopen is fd 3. End enumeration with EBADF.
            host.fd_prestat_get = (fd, out) => fd > 3 ? 8 : wasi.wasiImport.fd_prestat_get(fd, out);
            let instance;
            function adapt(name, paths) {
              host[name] = (...args) => {
                const memory = new Uint8Array(instance.exports.memory.buffer);
                for (const [fd, ptr] of paths) {
                  if (args[fd] !== -2) continue;
                  args[fd] = 3;
                  if (args[ptr + 1] && memory[args[ptr]] === 47) {
                    args[ptr]++;
                    args[ptr + 1]--;
                  }
                }
                if (name === 'path_open' && args[0] === 3) {
                  // Only normal fixture files are opened. Intersect the fork's broad
                  // request with read/write, seek/tell and filestat_get file rights.
                  const fixtureRights = (1n<<1n)|(1n<<6n)|(1n<<2n)|(1n<<5n)|(1n<<21n);
                  args[5] &= fixtureRights;
                  args[6] = 0n;
                }
                return wasi.wasiImport[name](...args);
              };
            }
            for (const name of ['path_create_directory', 'path_readlink',
                                'path_remove_directory', 'path_unlink_file'])
              adapt(name, [[0, 1]]);
            adapt('path_filestat_get', [[0, 2]]);
            adapt('path_open', [[0, 2]]);
            adapt('path_rename', [[0, 1], [3, 4]]);
            instance = new WebAssembly.Instance(module, {wasi_snapshot_preview1:host});
            const code = wasi.start(instance);
            if (code !== 0) throw Error(args.join(' ') + ' exited ' + code);
          }
          const available = new WASI({version:'preview1'}).wasiImport;
          const extra = [rand, signer].flatMap(m => WebAssembly.Module.imports(m))
            .filter(i => i.module !== 'wasi_snapshot_preview1' || typeof available[i.name] !== 'function');
          let status;
          if (extra.length) {
            status = 'Linked and validated. Device runtime test required for imports: ' +
                     [...new Set(extra.map(i => i.module+'.'+i.name))].join(', ');
          } else {
            run(rand, ['rand-probe']);
            run(signer, ['zsign','-v']);
            const fixture = 'zsign/test/dylib/bin/demo1.dylib';
            const copy = process.env.SMOKE_ROOT + '/smoke.dylib';
            fs.copyFileSync(fixture, copy);
            run(signer, ['zsign','-a','-f','-b','org.example.wasismoke','/smoke.dylib']);
            const signed = fs.readFileSync(copy);
            if (signed.equals(fs.readFileSync(fixture))) throw Error('Signed bytes did not change');
            if (!signed.includes(Buffer.from('org.example.wasismoke\0'))) throw Error('Missing signing identifier');
            status = 'WASI entropy, CLI startup, and ad-hoc Mach-O writeback passed under Node with a-Shell path translation.';
          }
          console.log(status);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, status + '\n');
          fs.writeFileSync('dist/validation.txt', status + '\n');
          JS
          if [[ -f "$SMOKE_ROOT/smoke.dylib" ]]; then
            python3 - "$SMOKE_ROOT/smoke.dylib" <<'PY'
          # Verify each CodeDirectory's executable-page hashes in the arm64 smoke fixture.
          import hashlib
          import struct
          from pathlib import Path
          import sys

          data = Path(sys.argv[1]).read_bytes()
          if struct.unpack_from("<I", data)[0] != 0xfeedfacf:
              raise ValueError("Expected a thin 64-bit Mach-O")
          offset = 32
          for _ in range(struct.unpack_from("<I", data, 16)[0]):
              cmd, size = struct.unpack_from("<II", data, offset)
              if cmd == 0x1d:
                  signature, length = struct.unpack_from("<II", data, offset + 8)
                  break
              offset += size
          else:
              raise ValueError("Missing LC_CODE_SIGNATURE")
          blob = data[signature:signature + length]
          magic, _, count = struct.unpack_from(">III", blob)
          assert magic == 0xfade0cc0
          checked = 0
          for index in range(count):
              _, start = struct.unpack_from(">II", blob, 12 + index * 8)
              if struct.unpack_from(">I", blob, start)[0] != 0xfade0c02:
                  continue
              cdsize = struct.unpack_from(">I", blob, start + 4)[0]
              cd = blob[start:start + cdsize]
              hashes, ident, _, slots, limit = struct.unpack_from(">IIIII", cd, 16)
              width, kind, _, exponent = cd[36:40]
              algorithm = {1: "sha1", 2: "sha256"}[kind]
              assert cd[ident:].split(b"\0", 1)[0] == b"org.example.wasismoke"
              page = 1 << exponent
              assert 0 < limit <= signature and slots == (limit + page - 1) // page
              for slot in range(slots):
                  chunk = data[slot * page:min(limit, (slot + 1) * page)]
                  digest = hashlib.new(algorithm, chunk).digest()
                  assert width == len(digest)
                  assert cd[hashes + slot*width:hashes + (slot+1)*width] == digest
              checked += 1
          assert checked, "No CodeDirectory found"
          print(f"Verified {checked} CodeDirectories against signed file bytes")
          PY
          fi
          cd dist
          sha256sum zsign.wasm > SHA256SUMS

      - name: Upload a-Shell command and validation results
        uses: actions/upload-artifact@v4
        with:
          name: zsign-wasm-holzschu
          path: dist/
          if-no-files-found: error
